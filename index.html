<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngFore - English Practice Platform</title>
</head>
<body>

    <!-- =================================================================
    APP LAYOUT WRAPPER
    ================================================================== -->
    <div class="app-layout">

        <!-- =================================================================
        SIDEBAR
        ================================================================== -->
        <aside class="sidebar">

            <!-- Sidebar: Logo -->
            <div class="sidebar-logo">
                <a href="/dashboard">EngFore</a>
            </div>

            <!-- Sidebar: Navigation -->
            <nav class="sidebar-nav">
                <!-- Group: Main -->
                <div class="nav-group">
                    <h2 class="nav-group-title">MAIN</h2>
                    <a href="/dashboard" class="nav-item">
                        <span class="nav-icon"><!-- Icon SVG/Font --></span>
                        <span class="nav-text">Dashboard</span>
                    </a>
                </div>

                <!-- Group: Learning -->
                <div class="nav-group">
                    <h2 class="nav-group-title">LEARNING</h2>
                    <a href="/vocabulary" class="nav-item">
                        <span class="nav-icon"><!-- Icon SVG/Font --></span>
                        <span class="nav-text">Vocabulary</span>
                    </a>
                </div>

                <!-- Group: Practice -->
                <div class="nav-group">
                    <h2 class="nav-group-title">PRACTICE</h2>
                    <a href="/review" class="nav-item">
                        <span class="nav-icon"><!-- Icon SVG/Font --></span>
                        <span class="nav-text">Review</span>
                    </a>
                </div>

                <!-- Group: Community -->
                <div class="nav-group">
                    <h2 class="nav-group-title">COMMUNITY</h2>
                    <a href="/community" class="nav-item">
                        <span class="nav-icon"><!-- Icon SVG/Font --></span>
                        <span class="nav-text">Community</span>
                    </a>
                </div>

                <!-- Group: Analytics -->
                <div class="nav-group">
                    <h2 class="nav-group-title">ANALYTICS</h2>
                    <a href="/analytics" class="nav-item">
                        <span class="nav-icon"><!-- Icon SVG/Font --></span>
                        <span class="nav-text">Analytics</span>
                    </a>
                </div>

                <!-- Group: System -->
                <div class="nav-group">
                    <h2 class="nav-group-title">SYSTEM</h2>
                    <a href="/settings" class="nav-item">
                        <span class="nav-icon"><!-- Icon SVG/Font --></span>
                        <span class="nav-text">Settings</span>
                    </a>
                    <a href="/premium" class="nav-item">
                        <span class="nav-icon"><!-- Icon SVG/Font --></span>
                        <span class="nav-text">Premium</span>
                    </a>
                    <a href="/feedback" class="nav-item">
                        <span class="nav-icon"><!-- Icon SVG/Font --></span>
                        <span class="nav-text">Feedback</span>
                    </a>
                </div>
            </nav>

            <!-- Sidebar: Footer -->
            <footer class="sidebar-footer">
                <p>&copy; 2026 EngFore</p>
            </footer>

        </aside>

        <!-- =================================================================
        TOPBAR
        ================================================================== -->
        <header class="topbar">

            <!-- Topbar: Search -->
            <div class="topbar-search">
                <form action="/search" method="get" role="search">
                    <label for="search-input" hidden>Search</label>
                    <input type="search" id="search-input" name="q" placeholder="Search vocabulary...">
                </form>
            </div>

            <!-- Topbar: Actions -->
            <div class="topbar-actions">
                <button type="button" aria-label="Notifications">
                    <!-- Notification Icon -->
                </button>
                <button type="button" aria-label="Help">
                    <!-- Help Icon -->
                </button>
            </div>

            <!-- Topbar: User -->
            <div class="topbar-user">
                <button type="button" aria-label="User menu">
                    <!-- User Avatar -->
                </button>
            </div>

        </header>

        <!-- =================================================================
        MAIN CONTENT
        ================================================================== -->
        <main class="main-content">

            <!-- Dashboard Placeholder -->
            <section id="dashboard">
                <h2>Dashboard</h2>
                <p>Welcome back. Your dashboard content will appear here.</p>
            </section>

        </main>

    </div>

</body>
</html>
